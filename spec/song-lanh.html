document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-height:1.15\">\n          <span style=\"font-family:var(--font-heading);font-weight:700;font-size:19px;letter-spacing:0.01em\">{{ brand }}<\u002Fspan>\n          <span style=\"font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Ăn lành · Sống lành · Ngủ lành<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <nav aria-label=\"Điều hướng chính\" style=\"display:flex;align-items:center;gap:22px;flex-wrap:wrap\">\n          <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"7\">\n            <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" aria-current=\"{{ it.current }}\" style=\"background:none;border:0;padding:4px 0;cursor:pointer;font-family:inherit;font-size:15.5px;font-weight:500;color:var(--color-text);border-bottom:2px solid transparent\" style-hover=\"color:var(--color-accent-700);border-bottom-color:var(--color-accent)\">{{ it.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;align-items:center;gap:8px;flex:none\">\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleSearch }}\" aria-label=\"Tìm kiếm\" class=\"btn btn-secondary btn-icon\" style=\"width:40px;height:40px\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z\"><\u002Fpath><path d=\"M16.5 16.5 21 21\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Mở menu\" aria-expanded=\"{{ menuOpen }}\" class=\"btn btn-secondary btn-icon\" style=\"width:40px;height:40px\">\n            <svg width=\"20\" height=\"20\" sc-camel ems:center;text-align:left;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:22px;padding:12px 16px;cursor:pointer;font-family:inherit;color:inherit\" style-hover=\"border-color:var(--color-accent)\">\n                  <span style=\"width:52px;height:52px;flex:none;border-radius:16px;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\">\n                    <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ r.iconPath }}\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                    <span style=\"font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700)\">{{ r.catName }}<\u002Fspan>\n                    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:17.5px;line-height:1.3\">{{ r.title }}<\u002Fspan>\n                    <span style=\"font-size:14.5px;line-height:1.5;color:var(--color-neutral-700)\">{{ r.excerpt }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav aria-label=\"Menu\" style=\"border-top:1px solid var(--color-divider);background:var(--color-bg);padding:12px 20px 20px;display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"7\">\n          <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" style=\"display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--color-divider);padding:15px 4px;cursor:pointer;font-family:inherit;font-size:17.5px;font-weight:500;color:inherit;text-align:left;min-height:48px\">\n            <span>{{ it.label }}<\u002Fspan>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <main data-screen-label=\"Trang chủ\">\n\n      <section style=\"width:100%;max-width:1160px;margin:0 auto;padding:clamp(34px,6vw,76px) 20px clamp(20px,3vw,34px);display:flex;flex-wrap:wrap;gap:clamp(26px,4vw,56px);align-items:center\">\n        <div style=\"flex:1 1 340px;min-width:0\">\n          <span class=\"tag tag-accent\" style=\"font-size:13px;padding:6px 14px\">Kinh nghiệm chia sẻ · không phải tư vấn y tế<\u002Fspan>\n          <h1 style=\"font-size:clamp(38px,7vw,64px);line-height:1.1;margin:18px 0 0;letter-spacing:-0.01em\">Lành từ gốc<\u002Fh1>\n          <p style=\"font-family:var(--font-heading);font-size:clamp(19px,2.4vw,24px);line-height:1.45;margin:14px 0 0;color:var(--color-accent-2-800)\">Những kinh nghiệm giản dị về ăn uống, vận động, giấc ngủ và chăm sóc cơ thể.<\u002Fp>\n          <p style=\"font-size:17.5px;line-height:1.75;margin:18px 0 0;max-width:56ch;text-wrap:pretty\">Trang này được tạo ra với mong muốn chia sẻ những kinh nghiệm và thói quen sống mà tôi biết, để mọi người có thêm một nguồn tham khảo trong quá trình chăm sóc sức khỏe của bản thân và gia đình.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:26px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ goExperiences }}\" class=\"btn btn-primary\" style=\"font-family:var(--font-body);font-weight:600;font-size:16px;padding:14px 26px;min-height:50px\">Xem các kinh nghiệm<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ goPrinciples }}\" class=\"btn btn-secondary\" style=\"font-family:var(--font-body);font-weight:600;font-size:16px;padding:14px 26px;min-height:50px\">Bắt đầu từ hôm nay<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 320px;min-width:0\">\n          <div class=\"washed\" style=\"border-radius:32px;overflow:hidden;box-shadow:var(--shadow-md);aspect-ratio:4/3;background:var(--color-accent-2-200)\">\n            <image-slot id=\"lg-hero\" shape=\"rounded\" radius=\"32\" placeholder=\"Ảnh: bàn gỗ mộc với chén chè xanh, chanh, gừng, mật ong, các loại đậu và rau củ\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <p style=\"font-size:13.5px;color:var(--color-neutral-700);margin:10px 4px 0\">Một bàn gỗ mộc: chén chè xanh, chanh, gừng, mật ong, các loại đậu và rau củ.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"kinh-nghiem\" style=\"width:100%;max-width:1160px;margin:0 auto;padding:clamp(28px,4vw,52px) 20px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n          <sc-for list=\"{{ catCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" class=\"card elev-sm\" style=\"text-align:left;cursor:pointer;font-family:inherit;color:inherit;padding:24px;gap:12px;border:1px solid var(--color-divider);transition:transform .2s ease, box-shadow .2s ease\" style-hover=\"transform:translateY(-3px);box-shadow:var(--shadow-md)\">\n              <span style=\"width:48px;height:48px;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\">\n                <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ c.iconPath }}\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-weight:600;font-size:21px;line-height:1.25\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.6;color:var(--color-neutral-800)\">{{ c.desc }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"width:100%;max-width:1160px;margin:0 auto;padding:clamp(30px,5vw,64px) 20px\">\n        <h2 style=\"font-size:clamp(28px,4vw,40px);margin:0\">Vận động mỗi ngày<\u002Fh2>\n        <p style=\"font-size:17.5px;max-width:62ch;margin:12px 0 28px;text-wrap:pretty\">Không nhất thiết phải tập luyện quá nặng. Điều quan trọng là duy trì vận động đều đặn và tạo thành thói quen.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start\">\n          <article style=\"background:var(--color-accent-2-700);color:var(--color-neutral-100);border-radius:32px;padding:clamp(24px,3vw,36px);box-shadow:var(--shadow-md)\">\n            <span style=\"font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-2-200)\">Kinh nghiệm nổi bật<\u002Fspan>\n            <h3 style=\"font-size:clamp(23px,3vw,30px);margin:10px 0 12px;color:var(--color-neutral-100)\">Vẩy tay Dịch Cân Kinh – 15 phút<\u002Fh3>\n            <p style=\"font-size:17px;line-height:1.7;margin:0 0 20px\">Đây là một bài tập đơn giản mà bạn có thể dành khoảng 15 phút mỗi ngày để thực hiện. Nếu chưa biết cách tập, có thể tìm video hướng dẫn trên YouTube và tập theo.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <sc-if value=\"{{ showYoutube }}\" hint-placeholder-val=\"{{ true }}\">\n                <a href=\"https://www.youtube.com/results?search_query=v%E1%BA%A9y+tay+d%E1%BB%8Bch+c%C3%A2n+kinh+h%C6%B0%E1%BB%9Bng+d%E1%BA%ABn\" target=\"_blank\" rel=\"noopener\" class=\"btn\" style=\"background:var(--color-neutral-100);color:var(--color-accent-2-800);font-family:var(--font-body);font-weight:600;font-size:15.5px;padding:13px 22px;min-height:48px;text-decoration:none\" style-hover=\"background:var(--color-accent-2-200)\">\n                  <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8Z\"><\u002Fpath><path d=\"M11 9l4 3-4 3V9Z\"><\u002Fpath><\u002Fsvg>\n                  Xem hướng dẫn trên YouTube\n                <\u002Fa>\n              <\u002Fsc-if>\n              <button type=\"button\" sc-camel-on-click=\"{{ goVayTay }}\" class=\"btn\" style=\"border:1px solid color-mix(in srgb, var(--color-neutral-100) 45%, transparent);color:var(--color-neutral-100);font-family:var(--font-body);font-weight:600;font-size:15.5px;padding:13px 22px;min-height:48px\" style-hover=\"background:color-mix(in srgb, var(--color-neutral-100) 14%, transparent)\">Đọc chi tiết<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <button type=\"button\" sc-camel-on-click=\"{{ goBedMoves }}\" class=\"card elev-sm\" style=\"text-align:left;cursor:pointer;font-family:inherit;color:inherit;padding:clamp(22px,3vw,32px);gap:12px;border:1px solid var(--color-divider);transition:transform .2s ease\" style-hover=\"transform:translateY(-3px)\">\n            <span class=\"tag tag-accent-2\" style=\"font-size:12.5px\">Kinh nghiệm tham khảo<\u002Fspan>\n            <span style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(21px,2.6vw,26px);line-height:1.25\">Vận động nhẹ khi nằm trên giường<\u002Fspan>\n            <span style=\"font-size:16.5px;line-height:1.7;color:var(--color-neutral-800)\">Khi nằm nghỉ trên giường, có thể thực hiện một số động tác nhẹ nhàng như vuốt tóc, xoa tai và đưa hai tay chạm xuống đất/sàn theo cách phù hợp với tư thế của mình.<\u002Fspan>\n            <span style=\"color:var(--color-accent-700);font-size:15px;font-weight:600\">Đọc kinh nghiệm →<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:var(--color-neutral-100);padding:clamp(34px,5vw,72px) 0\">\n        <div style=\"width:100%;max-width:1160px;margin:0 auto;padding:0 20px\">\n          <h2 style=\"font-size:clamp(28px,4vw,40px);margin:0 0 12px\">Vệ sinh cá nhân – đơn giản và tự nhiên<\u002Fh2>\n          <p style=\"font-size:17.5px;max-width:62ch;margin:0 0 28px\">Những thói quen chăm sóc cơ thể theo hướng đơn giản, tự nhiên — được chia sẻ để tham khảo.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n            <sc-for list=\"{{ hygieneCards }}\" as=\"it\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" class=\"card elev-sm\" style=\"text-align:left;cursor:pointer;font-family:inherit;color:inherit;padding:24px;gap:12px;background:var(--color-bg);border:1px solid var(--color-divider);transition:transform .2s ease\" style-hover=\"transform:translateY(-3px)\">\n                <span style=\"width:46px;height:46px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center\">\n                  <svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ it.iconPath }}\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1.25\">{{ it.title }}<\u002Fspan>\n                <span style=\"font-size:15.5px;line-height:1.65;color:var(--color-neutral-800)\">{{ it.excerpt }}<\u002Fspan>\n                <sc-if value=\"{ 02Fspan>\n            <span style=\"font-family:var(--font-heading);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1.2\">9 giờ tối đi ngủ<br>4 giờ sáng thức dậy<\u002Fspan>\n            <span style=\"font-size:16.5px;line-height:1.7;color:var(--color-neutral-300)\">Đây là một lịch sinh hoạt được chia sẻ trong trang như một kinh nghiệm về việc duy trì nếp sống đều đặn.<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:600;color:var(--lg-honey-300)\">Đọc kinh nghiệm →<\u002Fspan>\n          <\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goScreens }}\" class=\"card elev-sm\" style=\"text-align:left;cursor:pointer;font-family:inherit;color:inherit;padding:clamp(24px,3vw,34px);gap:14px;border:1px solid var(--color-divider);transition:transform .2s ease\" style-hover=\"transform:translateY(-3px)\">\n            <span style=\"display:flex;gap:10px\">\n              <span style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center\">\n                <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6v18H9V3Z\"><\u002Fpath><path d=\"M4 4l16 16\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center\">\n                <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 18v-8h12a5 5 0 0 1 5 5v3\"><\u002Fpath><path d=\"M3 14h17\"><\u002Fpath><path d=\"M3 18V6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(21px,2.6vw,26px);line-height:1.25\">Hạn chế điện thoại và tivi<\u002Fspan>\n            <span style=\"font-size:16.5px;line-height:1.7;color:var(--color-neutral-800)\">Buổi tối nên hạn chế thời gian sử dụng điện thoại, tivi và các thiết bị màn hình, đặc biệt trước giờ ngủ.<\u002Fspan>\n            <span style=\"color:var(--color-accent-700);font-size:15px;font-weight:600\">Đọc kinh nghiệm →<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:var(--color-surface);padding:clamp(34px,5vw,72px) 0\">\n        <div style=\"width:100%;max-width:1160px;margin:0 auto;padding:0 20px\">\n          <h2 style=\"font-size:clamp(28px,4vw,40px);margin:0 0 12px\">Ăn uống – lựa chọn thực phẩm đơn giản<\u002Fh2>\n          <p style=\"font-size:17.5px;max-width:62ch;margin:0 0 28px;text-wrap:pretty\">Những nguyên tắc dưới đây là kinh nghiệm ăn uống được chia sẻ. Không phải chế độ ăn bắt buộc cho tất cả mọi người.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px\">\n            <sc-for list=\"{{ foodCards }}\" as=\"it\" hint-placeholder-count=\"7\">\n              <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" style=\"text-align:left;cursor:pointer;font-family:inherit;color:inherit;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:transform .2s ease\" style-hover=\"transform:translateY(-3px)\">\n                <span style=\"display:flex;align-items:center;gap:10px\">\n                  <span style=\"width:40px;height:40px;flex:none;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center\">\n                    <svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap= n style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1.25\">{{ it.title }}<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.65;color:var(--color-neutral-800)\">{{ it.excerpt }}<\u002Fspan>\n              <sc-if value=\"{{ it.hasSteps }}\" hint-placeholder-val=\"{{ false }}\">\n                <span class=\"tag tag-accent-2\" style=\"font-size:12.5px\">Có hướng dẫn từng bước<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:var(--color-accent-2-100);padding:clamp(34px,5vw,72px) 0\">\n        <div style=\"width:100%;max-width:1160px;margin:0 auto;padding:0 20px\">\n          <h2 style=\"font-size:clamp(28px,4vw,40px);margin:0 0 12px\">Ngâm uống lâu dài<\u002Fh2>\n          <p style=\"font-size:17.5px;max-width:62ch;margin:0 0 28px;text-wrap:pretty\">Một số cách ngâm nguyên liệu được chia sẻ dưới đây. Đây là phần kinh nghiệm tham khảo, không phải hướng dẫn điều trị bệnh.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n            <sc-for list=\"{{ soakCards }}\" as=\"it\" hint-placeholder-count=\"2\">\n              <article style=\"background:var(--color-bg);border-radius:32px;padding:clamp(24px,3vw,34px);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:16px\">\n                <h3 style=\"font-size:clamp(22px,2.8vw,28px);margin:0\">{{ it.title }}<\u002Fh3>\n                <div>\n                  <p style=\"font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px\">Nguyên liệu<\u002Fp>\n                  <ul style=\"margin:0;padding-left:20px;font-size:16.5px;line-height:1.7\">\n                    <sc-for list=\"{{ it.ingredients }}\" as=\"ing\" hint-placeholder-count=\"3\">\n                      <li>{{ ing }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 10px\">Cách làm<\u002Fp>\n                  <ol style=\"margin:0;padding-left:22px;font-size:16.5px;line-height:1.7;display:flex;flex-direction:column;gap:6px\">\n                    <sc-for list=\"{{ it.steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                      <li>{{ st }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Fol>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" class=\"btn btn-secondary\" style=\"align-self:flex-start;font-family:var(--font-body);font-weight:600;font-size:15.5px;padding:12px 22px;min-height:46px\">Xem đầy đủ cách dùng và lưu ý<\u002Fbutton>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"nguyen-tac\" style=\"width:100%;max-width:1160px;margin:0 auto;padding:clamp(34px,5vw,72px) 20px\">\n        <h2 style=\"font-size:clamp(28px,4.2vw,44px);margin:0 0 28px\">Không cần quá phức tạp<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n          <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:24px 22px;border-radius:28px;border:1px solid var(--color-divider)\">\n              <span style=\"width:46px;height:46px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-weight:700;font-size:18px\">{{ p.no }}<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-weight:600;font-size:19.5px;line-height:1.3\">{{ p.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:clamp(18px,2.2vw,22px);line-height:1.6;max-width:60ch;margin:28px 0 0;font-family:var(--font-heading);color:var(--color-accent-2-800);text-wrap:pretty\">Điều quan trọng không phải làm thật nhiều thứ cùng lúc, mà là hình thành những thói quen phù hợp và duy trì lâu dài.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"width:100%;max-width:1160px;margin:0 auto;padding:0 20px clamp(40px,6vw,80px)\">\n        <div style=\"background:var(--lg-honey-100);border:1px solid var(--lg-honey-300);border-radius:32px;padding:clamp(24px,3.5vw,40px)\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n            <span style=\"width:42px;height:42px;flex:none;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-900);display:grid;place-items:center\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4l9 16H3L12 4Z\"><\u002Fpath><path d=\"M12 10v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h2 style=\"font-size:clamp(24px,3vw,32px);margin:0;color:var(--color-accent-900)\">Lưu ý trước khi áp dụng<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 32px;margin-top:14px;color:var(--color-accent-900)\">\n            <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 10px;text-wrap:pretty\">Những nội dung trên website được tổng hợp và chia sẻ dưới góc độ kinh nghiệm cá nhân, kinh nghiệm dân gian và lối sống. Mục đích của trang là chia sẻ thông tin để tham khảo, không thay thế cho chẩn đoán, điều trị hoặc tư vấn của bác sĩ.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 10px;text-wrap:pretty\">Không nên tự ý ngừng thuốc, thay đổi thuốc hoặc bỏ qua việc khám và điều trị đang được chỉ định để áp dụng các phương pháp trên.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.7;margin:0 0 10px;text-wrap:pretty\">Đặc biệt, người đang mang thai, trẻ nhỏ, người cao tuổi, người có bệnh nền, đang dùng thuốc hoặc có triệu chứng bất thường nên hỏi bác sĩ/dược sĩ trước khi áp dụng các phương pháp ăn uống, thảo dược hoặc ngâm uống thường xuyên.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.7;margin:0;text-wrap:pretty\">Nếu có triệu chứng cấp tính hoặc dấu hiệu nguy hiểm, cần tìm kiếm sự chăm sóc y tế phù hợp.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCat }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Chủ đề\" style=\"width:100%;max-width:1160px;margin:0 auto;padding:clamp(24px,4vw,48px) 20px clamp(40px,6vw,80px);animation:lgFade .3s ease both\">\n      <nav aria-label=\"Breadcrumb\" style=\"display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--color-neutral-700);margin-bottom:18px;flex-wrap:wrap\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--color-accent-700);font-weight:600\">Trang chủ<\u002Fbutton>\n        <span>›<\u002Fspan>\n        <span>{{ cat.name }}<\u002Fspan>\n      <\u002Fnav>\n      <h1 style=\"font-size:clamp(32px,5vw,50px);margin:0\">{{ cat.name }}<\u002Fh1>\n      <p style=\"font-size:17.5px;max-width:64ch;margin:14px 0 30px;text-wrap:pretty\">{{ cat.intro }}<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px\">\n        <sc-for list=\"{{ catArticles }}\" as=\"it\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" class=\"card elev-sm\" style=\"text-align:left;cursor:pointer;font-fam " : (this.catOf(id) || {}).name; }\n\n  card(a) {\n    return {\n      id: a.id, title: a.title, excerpt: a.excerpt, group: a.group || this.catName(a.cat),\n      catName: this.catName(a.cat), iconPath: IC[a.icon] || IC.leaf,\n      hasSteps: !!(a.steps && a.steps.length), hasNote: !!a.shortNote, shortNote: a.shortNote || \"\",\n      ingredients: a.ingredients || [], steps: a.steps || [],\n      onClick: () => this.nav({ t: \"article\", id: a.id })\n    };\n  }\n  byCat(id) { return ARTICLES.filter((a) => a.cat === id); }\n  pick(ids) { return ids.map((id) => this.card(ARTICLES.find((a) => a.id === id))); }\n\n  results() {\n    const q = norm(this.state.q).trim();\n    if (!q) return [];\n    return ARTICLES.filter((a) => norm([a.title, a.excerpt, a.summary, (a.tags || []).join(\" \"), this.catName(a.cat), (a.ingredients || []).join(\" \")].join(\" \")).includes(q)).map((a) => this.card(a));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const r = st.route;\n    const wide = st.w >= 900;\n    const navRoutes = [\n      { label: \"Trang chủ\", route: { t: \"home\" } },\n      ...CATS.map((c) => ({ label: c.name, route: { t: \"cat\", id: c.id } })),\n      { label: \"Lưu ý\", route: { t: \"notice\" } }\n    ];\n    const navItems = navRoutes.map((n) => ({\n      label: n.label,\n      current: (n.route.t === r.t && n.route.id === r.id) ? \"page\" : undefined,\n      onClick: () => this.nav(n.route)\n    }));\n    const footerItems = navRoutes.map((n) => ({\n      label: n.label === \"Lưu ý\" ? \"Lưu ý sức khỏe\" : n.label,\n      onClick: () => this.nav(n.route)\n    }));\n\n    const vals = {\n      brand: this.props.brandName ?? \"LÀNH TỪ GỐC\",\n      tagline: this.props.tagline ?? \"Chia sẻ những điều giản dị để sống lành mỗi ngày.\",\n      showYoutube: this.props.showYoutubeLink ?? true,\n      wide, narrow: !wide,\n      menuOpen: st.menuOpen, searchOpen: st.searchOpen,\n      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen, searchOpen: false })),\n      toggleSearch: () => this.setState((s) => ({ searchOpen: !s.searchOpen, menuOpen: false })),\n      navItems, footerItems,\n      goHome: () => this.nav({ t: \"home\" }),\n      goNotice: () => this.nav({ t: \"notice\" }),\n      goBack: () => this.back(),\n      query: st.q, hasQuery: st.q.trim().length > 0,\n      onQuery: (e) => this.setState({ q: e.target.value }),\n      searchRef: this.searchRef,\n      keywords: KEYWORDS.map((k) => ({ label: k, onClick: () => this.setState({ q: k }) })),\n      isHome: r.t === \"home\", isCat: r.t === \"cat\", isArticle: r.t === \"article\", isNotice: r.t === \"notice\",\n      goExperiences: () => this.scrollTo(\"kinh-nghiem\"),\n      goPrinciples: () => this.scrollTo(\"nguyen-tac\"),\n      goVayTay: () => this.nav({ t: \"article\", id: \"vay-tay\" }),\n      goBedMoves: () => this.nav({ t: \"article\", id: \"van-dong-tren-giuong\" }),\n      goSleep: () => this.nav({ t: \"article\", id: \"ngu-som\" }),\n      goScreens: () => this.nav({ t: \"article\", id: \"han-che-man-hinh\" }),\n      catCards: [\"van-dong\", \"ve-sinh\", \"an-uong\", \"giac-ngu\"].map((id) => {\n        const c = this.catOf(id);\n        return { name: c.name, desc: c.desc, iconPath: IC[c.icon], onClick: () => this.nav({ t: \"cat\", id }) };\n      }),\n      hygieneCards: this.byCat(\"ve-sinh\").map((a) => this.card(a)),\n      foodCards: this.byCat(\"an-uong\").map((a) => this.card(a)),\n      drinkCards: this.pick([\"che-tuoi\", \"nuoc-chanh-mat-ong\", \"tam-that\", \"san-day\"]),\n      soakCards: this.pick([\"hoa-du-du-ngam-mat-ong\", \"mo-muoi-ngam-mat-ong\"]),\n      principles: [\n        { no: \"01\", text: \"Ăn đơn giản\" }, { no: \"02\", text: \"Vận động đều\" }, { no: \"03\", text: \"Ngủ đúng giờ\" },\n        { no: \"04\", text: \"Giữ cơ thể sạch sẽ\" }, { no: \"05\", text: \"Ưu tiên thực phẩm có nguồn gốc rõ ràng\" }\n      ],\n      results: this.results(),\n      resultLabel: this.results().length ? `Tìm thấy ${this.results().length} kinh nghiệm` : \"Chưa tìm thấy nội dung phù hợp. Thử một trong các từ khóa gợi ý ở trên.\"\n    };\n\n    if (r.t === \"cat\") {\n      const c = this.catOf(r.id) || CATS[0];\n      vals.cat = { name: c.name, intro: c.intro };\n      vals.catArticles = this.byCat(c.id).map((a) => this.card(a));\n    }\n    if (r.t === \"article\") {\n      const a = ARTICLES.find((x) => x.id === r.id) || ARTICLES[0];\n      vals.a = {\n        title: a.title, excerpt: a.excerpt, summary: a.summary, catName: this.catName(a.cat),\n        slotId: \"lg-\" + a.id, photoHint: a.photoHint || \"Ảnh minh họa thiên nhiên\",\n        hasHighlight: !!a.highlight, highlight: a.highlight || \"\",\n        hasIngredients: !!(a.ingredients && a.ingredients.length), ingredients: a.ingredients || [],\n        hasSteps: !!(a.steps && a.steps.length), steps: (a.steps || []).map((t, i) => ({ n: i + 1, text: t })),\n        hasUsage: !!a.usage, usage: a.usage || \"\",\n        hasYoutube: !!a.youtube && (this.props.showYoutubeLink ?? true),\n        notes: a.notes || [NOTE_GENERIC], tags: a.tags || []\n      };\n      vals.goArticleCat = () => this.nav({ t: \"cat\", id: a.cat });\n      const same = ARTICLES.filter((x) => x.cat === a.cat && x.id !== a.id);\n      const others = ARTICLES.filter((x) => x.cat !== a.cat);\n      vals.related = same.concat(others).slice(0, 3).map((x) => this.card(x));\n    }\n    return vals;\n  }\n\n  scrollTo(id) {\n    const go = () => {\n      const el = document.getElementById(id);\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: \"smooth\" });\n    };\n    if (this.state.route.t !== \"home\") { this.nav({ t: \"home\" }); setTimeout(go, 60); } else go();\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
